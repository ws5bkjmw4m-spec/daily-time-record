.intro{align-items:center}.intro p{max-width:430px}.event-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 18px;font-size:12px;color:var(--muted)}.event-form{background:#fafaf6;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:28px}.event-form[hidden]{display:none}.event-form h3{font-size:16px;margin:0 0 17px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .wide{grid-column:1/-1}.form-grid label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.form-grid input,.form-grid textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:white;padding:11px 12px;color:var(--ink);font-size:15px}.form-grid textarea{resize:vertical;min-height:65px;line-height:1.65}.form-hint{font-size:11px;line-height:1.8;color:var(--muted);margin:12px 0 0}.form-error{font-size:13px;color:#a25344;line-height:1.7;margin:12px 0 0}.form-error:empty{display:none}.timeline{height:2880px;margin:30px 0 0;position:relative;--axis:85px}.timeline:before{display:none}.hour-line{position:absolute;left:var(--axis);right:0;border-top:1px solid var(--line);height:0}.hour-line .hour-label{position:absolute;right:calc(100% + 15px);top:-8px;font:13px ui-monospace,SFMono-Regular,monospace;white-space:nowrap;color:var(--muted)}.hour-label small{display:block;font:10px -apple-system,BlinkMacSystemFont,sans-serif;margin-top:4px;color:#999f91}.hour-line.midnight-line{border-color:#a3b29b}.hour-line.midnight-line .hour-label{color:var(--green)}.half-line{position:absolute;left:var(--axis);right:0;border-top:1px dashed #e5e6dd;pointer-events:none}.event-area{position:absolute;top:0;bottom:0;left:calc(var(--axis) + 8px);right:0}.event-block{position:absolute;text-align:left;border:1px solid #b9caae;border-left:3px solid var(--green);border-radius:6px;background:#e5ecdd;color:var(--ink);padding:10px 12px;overflow:hidden;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.55;mi <body>
<noscript><p class="noscript">請啟用 JavaScript 才能輸入與儲存時間紀錄。</p></noscript>
<header><div class="top"><div class="brand"><span class="mark" aria-hidden="true"></span><h1>日常刻度</h1><small>留下一天的軌跡</small></div><div class="datebar"><button class="nav" id="previous" aria-label="前一天">‹</button><div class="dategroup"><div class="daytitle"><span class="datewrap"><span id="dateText"></span><input id="datePicker" type="date" min="1900-01-01" max="9998-12-31" aria-label="選擇紀錄日期"></span><span class="weekday" id="weekday"></span></div><div class="range" id="dateRange"></div></div><button class="nav" id="next" aria-label="後一天">›</button><button class="today" id="today">今天</button></div></div></header>
<main><div class="intro"><div><h2>時間，花在哪裡？</h2><p>指定事件的起訖時間，留下這一天的軌跡。</p></div><div class="count"><strong id="recordCount">0</strong> 件事件<br><span id="recordDuration" class="unit">已記錄 0 分鐘</span></div></div><div class="progress" aria-hidden="true"><span id="progress"></span></div><div class="event-toolbar"><span>05:00 → 隔天 04:00<br>事件色塊的長度代表持續時間</span><div class="toolbar-actions"><button class="secondary markdown-export" id="exportMarkdown" type="button" title="匯出目前日期已儲存的事件">匯出 .md</button><button class="primary" id="addEvent">＋ 新增事件</button></div></div>
<form class="event-form" id="eventForm" hidden novalidate><h3 id="formTitle">新增事件</h3><div class="form-grid"><div><label for="startTime">開始時間</label><input id="startTime" type="text" inputmode="numeric" placeholder="08:05" autocomplete="off" maxlength="5" required></div><div><label for="endTime">結束時間</label><input id="endTime" type="text" inputmode="numeric" placeholder="09:28" autocomplete="off" maxlength="5" required></div><div class="wide"><label for="entryText">做了什麼？</label><textarea id="entryText" placeholder="例如：閱讀、工作、運動、休息…" rows="2" required></textarea></div></div><p class="form-hint">可輸入 8:05 或 0805。00:00～04:59 為隔天；結束時間 05:00 為隔天 05:00。</p><p class="form-error" id="formError" role="alert"></p><div class="editactions"><button class="secondary" id="cancelEdit" type="button">取消編輯</button><button class="primary" type="submit">儲存事件</button></div></form>
<div class="timeline" id="timeline" aria-label="整天時間紀錄"></div><div class="endnote">時間表涵蓋當天 05:00 到隔天 05:00<br>點事件色塊可編輯；短事件也可在下方清單操作。</div><section class="event-list" id="eventList" aria-label="當天事件清單"></section><footer><span class="status" id="storageStatus" role="status">紀錄保存在這個瀏覽器</span><button class="restore" id="export" type="button">下載紀錄備份 ↗</button></footer></main>
<div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button id="undo" hidden>復原</button><button id="dismiss" aria-label="關閉提示">×</button></div>
<dialog class="leave-dialog" id="leaveDialog" aria-labelledby="leaveTitle"><h2 id="leaveTitle">修改還沒儲存</h2><p>要放棄目前的修改嗎？已經儲存的紀錄會保留。</p><div class="editactions"><button class="secondary" id="keepEditing">繼續編輯</button><button class="primary" id="discardDraft">放棄修改</button></div></dialog>
<script>
(() => {
  'use strict';
  const KEY='daily-time-log.v2', OLD_KEY='daily-time-log.v1', SCALE=2;
  const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0');
  function dateKey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
  function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12);}
  function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return dateKey(d);}
  function currentDay(){const d=new Date();if(d.getHours()<5)d.setDate(d.getDate()-1);return dateKey(d);}
  function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&s>='1900-01-01'&&s<='9998-12-31'&&dateKey(parseDate(s))===s;}
  // Minutes measured from 05:00, independent of daylight-saving clock changes.
  function parseTime(value){const s=value.trim();let h,m;const colon=/^(\d{1,2}):(\d{2})$/.exec(s);if(colon){h=Number(colon[1]);m=Number(colon[2]);}else if(/^\d{3,4}$/.test(s)){h=Number(s.slice(0,-2));m=Number(s.slice(-2));}else return null;if(h>23||m>59)return null;return {h,m,offset:(h*60+m-300+1440)%1440,text:`${pad(h)}:${pad(m)}`};}
  function interval(start,end){const a=parseTime(start),b=parseTime(end);if(!a||!b)return {error:'請輸入有效時間，例如 8:05、0805 或 09:28。'};const finish=b.offset===0?1440:b.offset;if(finish<=a.offset)return {error:'結束時間必須晚於開始時間，且事件須在當天 05:00～隔天 05:00 之內。'};return {start:a.offset,end:finish};}
  function clock(offset){const mins=(offset+300)%1440;return `${pad(Math.floor(mins/60))}:${pad(mins%60)}`;}
  function timeLabel(offset){return `${offset>=1140?'隔天 ':''}${clock(offset)}`;}
  function rangeLabel(e){return `${timeLabel(e.start)}～${timeLabel(e.end)}`;}
  function durationText(n){return n>=60?`${Math.floor(n/60)} 小時${n%60?` ${n%60} 分鐘`:''}`:`${n} 分鐘`;}
  function unionMinutes(events){const sorted=[...events].sort((a,b)=>a.start-b.start);let total=0,end=0;for(const e of sorted){total+=Math.max(0,e.end-Math.max(end,e.start));end=Math.max(end,e.end);}return total;}
  function markdownCell(text){return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\\/g,'\\\\').replace(/[`*_{}\[\]()#+.!|~]/g,'\\$&').replace(/\r\n?|\n/g,'<br>');}
  function dayMarkdown(day,events){const sorted=[...events].sort((a,b)=>a.start-b.start||a.end-b.end||a.id.localeCompare(b.id));const lines=[`# ${day} 時間紀錄`,'',`- 時間範圍：${day} 05:00 ～ ${addDays(day,1)} 05:00`,`- 事件數：${events.length} 件`,`- 已記錄時間：${durationText(unionMinutes(events))}（重疊時段只計算一次）`,''];if(!sorted.length){lines.push('這一天尚未有已儲存的事件。');}else{lines.push('| 開始時間 | 結束時間 | 持續時間 | 做了什麼 |','| --- | --- | --- | --- |');for(const e of sorted)lines.push(`| ${timeLabel(e.start)} | ${timeLabel(e.end)} | ${durationText(e.end-e.start)} | ${markdownCell(e.text)} |`);}return lines.join('\n')+'\n';}
  // Overlapping events share horizontal lanes within each connected overlap group.
  function layout(events){const sorted=[...events].sort((a,b)=>a.start-b.start||b.end-a.end||a.id.localeCompare(b.id));const result=[];let group=[],ends=[],groupEnd=-1;function flush(){for(const e of group)result.push({...e,columns:ends.length});group=[];ends=[];groupEnd=-1;}for(const e of sorted){if(group.length&&e.start>=groupEnd)flush();let col=ends.findIndex(end=>end<=e.start);if(col<0)col=ends.length;ends[col]=e.end;group.push({...e,column:col});groupEnd=Math.max(groupEnd,e.end);}flush();return result;}
  function validData(v){return v&&v.version===2&&v.days&&typeof v.days==='object'&&!Array.isArray(v.days)&&Object.entries(v.days).every(([day,events])=>validDate(day)&&Array.isArray(events)&&new Set(events.map(e=>e?.id)).size===events.length&&events.every(e=>e&&typeof e.id==='string'&&/^[a-zA-Z0-9_-]{1,100}$/.test(e.id)&&typeof e.text==='string'&&e.text.trim().length>0&&Number.isInteger(e.start)&&Number.isInteger(e.end)&&e.start>=0&&e.end<=1440&&e.start<e.end));}
  function migrate(v){if(!v||typeof v!=='object'||Array.isArray(v))throw Error('invalid legacy');const days={};for(const [day,items] of Object.entries(v)){if(!validDate(day)||!items||typeof items!=='object'||Array.isArray(items))throw Error('invalid legacy');const events=[];for(const [hour,text] of Object.entries(items)){if(!/^(?:[0-9]|1[0-9]|2[0-3])$/.test(hour)||typeof text!=='string')throw Error('invalid legacy');if(!text.trim())continue;const start=(Number(hour)-5+24)%24*60;events.push({id:`legacy-${day}-${hour}`,start,end:start+60,text});}if(events.length)days[day]=events;}return {version:2,days};}
  let data={version:2,days:{}},blocked=false,selected=currentDay(),editing=null,baseline='',pendingLeave=null,undoAction=null,toastTimer=null;
  function status(text,error=false){$('storageStatus').textContent=text;$('storageStatus').classList.toggle('error',error);}
  try{const raw=localStorage.getItem(KEY);if(raw!==null){data=JSON.parse(raw);if(!validData(data))throw Error('invalid');}else{const old=localStorage.getItem(OLD_KEY);if(old!==null){data=migrate(JSON.parse(old));status('已讀取舊紀錄；舊版資料仍保留');}}}catch(e){blocked=true;data={version:2,days:{}};status('無法讀取紀錄，暫停儲存功能',true);}
  function notify(message,action=null){clearTimeout(toastTimer);undoAction=action;$('toastText').textContent=message;$('undo').hidden=!action;$('toast').hidden=false;if(!action)toastTimer=setTimeout(()=>$('toast').hidden=true,4500);}
  function persist(next){if(blocked){notify('目前無法儲存，請檢查瀏覽器儲存設定。');return false;}try{localStorage.setItem(KEY,JSON.stringify(next));data=next;status('已儲存於這個瀏覽器');return true;}catch(e){status('儲存失敗，請先下載紀錄備份',true);notify('儲存失敗，輸入內容仍保留在畫面中。');return false;}}
  function writeDay(day,events){const next={version:2,days:{...data.days,[day]:events}};if(!events.length)delete next.days[day];return persist(next);}
  function formValue(){return JSON.stringify([$ ('startTime').value,$('endTime').value,$('entryText').value]);}
  function dirty(){return editing!==null&&formValue()!==baseline;}
  function requestLeave(action){if(!dirty()){action();return;}pendingLeave=action;$('leaveDialog').showModal();}
  function closeEditor(){editing=null;$('eventForm').hidden=true;$('formError').textContent='';}
  function openEditor(event=null){requestLeave(()=>{editing=event?{id:event.id}:{};$('formTitle').textContent=event?'編輯事件':'新增事件';$('startTime').value=event?clock(event.start):'08:05';$('endTime').value=event?clock(event.end):'09:28';$('entryText').value=event?.text||'';$('eventForm').hidden=false;$('formError').textContent='';baseline=formValue();$('eventForm').scrollIntoView({block:'center',behavior:'auto'});$('entryText').focus({preventScroll:true});});}
  function selectDay(day){$('datePicker').value=selected;if(!validDate(day))return;requestLeave(()=>{selected=day;closeEditor();render();window.scrollTo({top:0,behavior:'auto'});});}
  function button(text,cls,label,fn){const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=text;b.setAttribute('aria-label',label);b.addEventListener('click',fn);return b;}
  function removeEvent(id){const day=selected,events=data.days[day]||[],old=events.find(e=>e.id===id);if(!old)return;requestLeave(()=>{if(!writeDay(day,events.filter(e=>e.id!==id)))return;if(editing?.id===id)closeEditor();render();notify('事件已清除',()=>{const current=data.days[day]||[];if(current.some(e=>e.id===id)){notify('事件已存在，未覆蓋。');return;}if(writeDay(day,[...current,old])){render();notify('已復原事件');}});});}
  function render(){
    const d=parseDate(selected),tomorrow=addDays(selected,1),week=['週日','週一','週二','週三','週四','週五','週六'];$('dateText').textContent=`${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`;$('weekday').textContent=week[d.getDay()];$('datePicker').value=selected;$('dateRange').textContent=`${selected.slice(5).replace('-','/')} 05:00 — ${tomorrow.slice(5).replace('-','/')} 05:00`;$('previous').disabled=selected==='1900-01-01';$('next').disabled=selected==='9998-12-31';
    const events=data.days[selected]||[],minutes=unionMinutes(events);$('recordCount').textContent=events.length;$('recordDuration').textContent=`已記錄 ${durationText(minutes)}`;$('progress').style.width=`${minutes/1440*100}%`;
    const fragment=document.createDocumentFragment();for(let i=0;i<24;i++){const line=document.createElement('div');line.className=`hour-line${i===19?' midnight-line':''}`;line.style.top=`${i*60*SCALE}px`;const label=document.createElement('span');label.className='hour-label';label.textContent=clock(i*60);if(i>=19){const sub=document.createElement('small');sub.textContent='隔天';label.append(sub);}line.append(label);fragment.append(line);const half=document.createElement('div');half.className='half-line';half.style.top=`${(i*60+30)*SCALE}px`;fragment.append(half);}
    const area=document.createElement('div');area.className='event-area';
    for(const e of layout(events)){const n=e.end-e.start,b=button('','event-block'+(n<30?' compact':'')+(n<8?' tiny':''),`${rangeLabel(e)}，${e.text}，編輯事件`,()=>openEditor(e));b.style.top=`${e.start*SCALE}px`;b.style.height=`${n*SCALE}px`;b.style.left=`calc(${e.column/e.columns*100}% + 2px)`;b.style.width=`calc(${100/e.columns}% - 4px)`;b.dataset.eventId=e.id;b.title=`${rangeLabel(e)} · ${durationText(n)}\n${e.text}`;const time=document.createElement('span');time.className='event-time';time.textContent=`${clock(e.start)}–${clock(e.end)} · ${durationText(n)}`;const text=document.createElement('span');text.className='event-name';text.textContent=e.text;b.append(time,text);area.append(b);}fragment.append(area);
    if(selected===currentDay()){const now=new Date(),offset=(now.getHours()*60+now.getMinutes()-300+1440)%1440;const line=document.createElement('div');line.className='now-line';line.style.top=`${offset*SCALE}px`;const label=document.createElement('span');label.textContent=clock(offset);line.append(label);fragment.append(line);}$('timeline').replaceChildren(fragment);
    const list=document.createDocumentFragment(),heading=document.createElement('h3');heading.textContent=`當天事件 · ${events.length} 件`;list.append(heading);if(!events.length){const p=document.createElement('p');p.className='empty-list';p.textContent='還沒有事件。按上方「新增事件」，輸入起訖時間與做過的事。';list.append(p);}for(const e of [...events].sort((a,b)=>a.start-b.start||a.end-b.end)){const item=document.createElement('div');item.className='event-item';const info=document.createElement('div');info.className='event-info';const text=document.createElement('p');text.textContent=e.text;const detail=document.createElement('div');detail.className='event-detail';detail.textContent=`${rangeLabel(e)} · ${durationText(e.end-e.start)}`;info.append(text,detail);const actions=document.createElement('div');actions.className='actions';actions.append(button('編輯','smallbtn',`編輯事件：${e.text}`,()=>openEditor(e)),button('清除','smallbtn clear',`清除事件：${e.text}`,()=>removeEvent(e.id)));item.append(info,actions);list.append(item);}$('eventList').replaceChildren(list);
  }
  function save(e){e.preventDefault();const period=interval($('startTime').value,$('endTime').value),text=$('entryText').value.trim();if(period.error){$('formError').textContent=period.error;return;}if(!text){$('formError').textContent='請輸入做過的事情。';$('entryText').focus();return;}if(!editing)return;const events=data.days[selected]||[];if(editing.id&&!events.some(e=>e.id===editing.id)){$('formError').textContent='此事件已在另一分頁移除，請取消後重新新增。';return;}const event={id:editing.id||crypto.randomUUID(),text,start:period.start,end:period.end};const next=editing.id?events.map(e=>e.id===event.id?event:e):[...events,event];if(writeDay(selected,next)){closeEditor();render();notify('事件已儲存');}}
  $('addEvent').onclick=()=>openEditor();$('eventForm').onsubmit=save;$('cancelEdit').onclick=()=>{closeEditor();render();};$('previous').onclick=()=>selectDay(addDays(selected,-1));$('next').onclick=()=>selectDay(addDays(selected,1));$('today').onclick=()=>selectDay(currentDay());$('datePicker').onchange=e=>selectDay(e.target.value);
  for(const id of ['startTime','endTime'])$(id).addEventListener('blur',()=>{const time=parseTime($(id).value);if(time)$(id).value=time.text;});
  $('entryText').addEventListener('keydown',e=>{if(e.isComposing)return;if((e.ctrlKey||e.metaKey)&&e.key==='Enter')save(e);if(e.key==='Escape')closeEditor();});
  $('keepEditing').onclick=()=>{pendingLeave=null;$('leaveDialog').close();$('entryText').focus();};$('discardDraft').onclick=()=>{const action=pendingLeave;pendingLeave=null;$('leaveDialog').close();closeEditor();if(action)action();};$('leaveDialog').addEventListener('cancel',()=>{pendingLeave=null;});
  $('undo').onclick=()=>{const action=undoAction;undoAction=null;$('toast').hidden=true;if(action)action();};$('dismiss').onclick=()=>{$('toast').hidden=true;undoAction=null;};
  $('export').onclick=()=>{if(blocked){notify('尚未成功讀取紀錄，無法建立備份。');return;}const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`時間紀錄-${dateKey(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已下載紀錄備份');};
  $('exportMarkdown').onclick=()=>{if(blocked){notify('尚未成功讀取紀錄，無法匯出 Markdown。');return;}const blob=new Blob([dayMarkdown(selected,data.days[selected]||[])],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`時間紀錄-${selected}.md`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify(dirty()?'已匯出當天已儲存的事件；目前修改尚未儲存。':'已匯出當天 Markdown 紀錄');};
  window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue='';}});
  window.addEventListener('storage',e=>{if(e.key!==KEY)return;try{const v=e.newValue===null?{version:2,days:{}}:JSON.parse(e.newValue);if(!validData(v))throw Error();data=v;blocked=false;render();status('紀錄已更新（來自另一個分頁）');if(editing)notify('其他分頁更新了紀錄；目前的輸入仍保留。');}catch(err){blocked=true;status('紀錄格式異常，暫停儲存功能',true);}});
  setInterval(()=>{if(!editing)render();},60000);render();
})();
</script>
